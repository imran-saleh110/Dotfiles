add_newline = true
command_timeout = 3600
"$schema" = 'https://starship.rs/config-schema.json'

format = """$username@$hostname $directory${custom.giturl}$git_branch$git_status$golang$python$nodejs$rust$docker_context$aws$kubernetes$character"""

[username]
show_always = true
style_user = "green"
style_root = "green"
format = '[$user]($style)'

[hostname]
ssh_only = false
format = '[$hostname]($style)'
style = "green"

[character]
success_symbol = '[\$](blue)'
error_symbol = "[✗](blue)"
vimcmd_symbol = '[\$](blue)'
# error_symbol = '[➜](bold red)'

[directory]
style = "blue"
format = "[$path]($style) "
truncation_length = 0
truncate_to_repo = false
fish_style_pwd_dir_length = 0
truncation_symbol = ""

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = "󰝚 Music"
"Pictures" = " Pictures"

[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL"
"""
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
style = "bold lavender"
format = "[$output]($style)"

[git_branch]
style = "bold red"
format = 'on [$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'

[golang]
symbol = " "
format = '[$symbol($version )]($style)'
detect_files = ["go.mod"]
style = "bold teal"

[python]
symbol = " "
format = '[$symbol($version )]($style)'

[nodejs]
symbol = " "
format = '[$symbol($version )]($style)'

[rust]
symbol = " "
format = '[$symbol($version )]($style)'

[docker_context]
symbol = " "
format = '[$symbol($context )]($style)'
disabled = true

[kubernetes]
symbol = "☸ "
disabled = true
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '

[c]
symbol = " "
format = '[$symbol($version )]($style)'

[java]
symbol = " "
format = '[$symbol($version )]($style)'

[haskell]
symbol = " "
format = '[$symbol($version )]($style)'

[php]
symbol = " "
format = '[$symbol($version )]($style)'
